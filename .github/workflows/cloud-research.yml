name: Cloud research

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight has no AI calls and never publishes to GitHub'
        type: choice
        options: [preflight, research]
        default: preflight
        required: true

permissions:
  contents: read

concurrency:
  group: cloud-research-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    if: github.repository == 'Simonn777/embodied-vision-reliability' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      run_ai: ${{ steps.gate.outputs.run_ai }}
      run_publish: ${{ steps.gate.outputs.run_publish }}
      date: ${{ steps.gate.outputs.date }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode || 'research' }}
          ENABLED: ${{ vars.CLOUD_RESEARCH_ENABLED }}
          HAS_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          python3 -I scripts/cloud_pipeline.py gate --event "$EVENT" --mode "$MODE" --enabled "$ENABLED" --has-api-key "$HAS_API_KEY" --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/gate.json"
          cat "$RUNNER_TEMP/gate.json" >> "$GITHUB_STEP_SUMMARY"

  research:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      has_changes: ${{ steps.bundle.outputs.has_changes }}
    env:
      RESEARCH_DATE: ${{ needs.gate.outputs.date }}
      RESEARCH_BASE_SHA: ${{ needs.gate.outputs.base_sha }}
      RUN_AI: ${{ needs.gate.outputs.run_ai }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Prepare dependencies and a protected bundle helper before model execution
        run: |
          python -m pip install -e '.[dev]' pytest==8.4.2
          sudo install -o root -g root -m 0444 scripts/cloud_pipeline.py /opt/cloud_pipeline.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq acl
      - name: Make a clearly labeled preflight fixture
        if: needs.gate.outputs.run_ai != 'true'
        run: |
          printf 'Infrastructure rehearsal only. No AI call, research finding, or public commit.\n' > docs/cloud-preflight-fixture.txt
      - name: Conduct one bounded research session
        if: needs.gate.outputs.run_ai == 'true'
        timeout-minutes: 32
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.163.0'
          model: ${{ vars.CLOUD_RESEARCH_MODEL || 'gpt-6.1-sol' }}
          effort: medium
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          codex-args: '["--search", "--ephemeral"]'
          prompt-file: .github/cloud/research-prompt.md
      # No candidate program or dependency is executed after the model in this job.
      - name: Package a bounded diff with the trusted helper
        id: bundle
        run: |
          flags=()
          if [[ "$RUN_AI" != true ]]; then flags+=(--preflight); fi
          /usr/bin/python3 -I /opt/cloud_pipeline.py bundle --base-sha "$RESEARCH_BASE_SHA" --date "$RESEARCH_DATE" --output "$RUNNER_TEMP/proposal" --allow-no-change --github-output "$GITHUB_OUTPUT" "${flags[@]}" | tee "$RUNNER_TEMP/bundle-status.json"
          cat "$RUNNER_TEMP/bundle-status.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.bundle.outputs.has_changes == 'true'
        with:
          name: proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proposal/
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: [gate, research]
    if: needs.research.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RESEARCH_DATE: ${{ needs.gate.outputs.date }}
      RESEARCH_BASE_SHA: ${{ needs.gate.outputs.base_sha }}
      RUN_AI: ${{ needs.gate.outputs.run_ai }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proposal
      - name: Prepare the trusted validator and baseline checks
        run: |
          cp scripts/cloud_pipeline.py "$RUNNER_TEMP/cloud_pipeline.py"
          mkdir -p "$RUNNER_TEMP/baseline/scripts"
          cp -R tests "$RUNNER_TEMP/baseline/tests"
          cp scripts/cloud_pipeline.py "$RUNNER_TEMP/baseline/scripts/cloud_pipeline.py"
          cp .github/cloud/validate.py "$RUNNER_TEMP/validate.py"
          docker build -t research-validation -f .github/cloud/Dockerfile .github/cloud
          docker image inspect research-validation --format '{{.Id}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Check and apply the proposal
        run: |
          flags=()
          if [[ "$RUN_AI" != true ]]; then flags+=(--preflight); fi
          python3 -I "$RUNNER_TEMP/cloud_pipeline.py" apply --bundle "$RUNNER_TEMP/proposal" --base-sha "$RESEARCH_BASE_SHA" --date "$RESEARCH_DATE" "${flags[@]}"
      - name: Test candidate code without network, secrets, host writes, or Docker socket
        run: |
          mkdir -p scratch/cloud-validation
          chmod 777 scratch/cloud-validation
          timeout 600 docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 6g --cpus 2 --user 65534:65534 --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            -v "$PWD:/work:ro" -v "$PWD/scratch/cloud-validation:/work/scratch/cloud-validation:rw" \
            -v "$RUNNER_TEMP/baseline:/baseline:ro" -v "$RUNNER_TEMP/validate.py:/validate.py:ro" \
            research-validation python -I /validate.py
          for report in baseline candidate; do
            python3 -I -c 'import sys,xml.etree.ElementTree as E; suites=list(E.parse(sys.argv[1]).getroot().iter("testsuite")); assert sum(int(s.get("tests",0)) for s in suites)>=17; assert not any(any(int(s.get(k,0)) for k in ("failures","errors","skipped")) for s in suites)' "scratch/cloud-validation/$report.xml"
          done
          printf 'Candidate and baseline tests plus smoke experiment passed in an isolated container.\n' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [gate, research, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RESEARCH_DATE: ${{ needs.gate.outputs.date }}
      RESEARCH_BASE_SHA: ${{ needs.gate.outputs.base_sha }}
      RUN_PUBLISH: ${{ needs.gate.outputs.run_publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proposal
      - name: Apply the exact validated artifact with trusted infrastructure
        run: |
          cp scripts/cloud_pipeline.py "$RUNNER_TEMP/cloud_pipeline.py"
          flags=()
          if [[ "$RUN_PUBLISH" != true ]]; then flags+=(--preflight); fi
          python3 -I "$RUNNER_TEMP/cloud_pipeline.py" apply --bundle "$RUNNER_TEMP/proposal" --base-sha "$RESEARCH_BASE_SHA" --date "$RESEARCH_DATE" "${flags[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Rehearse publication to a temporary local remote only
        if: needs.gate.outputs.run_publish != 'true'
        run: |
          git -c core.hooksPath=/dev/null commit -m 'Infrastructure preflight fixture (not research)'
          git init --bare "$RUNNER_TEMP/preflight-remote.git"
          git -c core.hooksPath=/dev/null push "$RUNNER_TEMP/preflight-remote.git" HEAD:refs/heads/preflight
          test "$(git rev-parse HEAD)" = "$(git --git-dir="$RUNNER_TEMP/preflight-remote.git" rev-parse refs/heads/preflight)"
          printf 'Cloud preflight passed. No AI invocation or GitHub publication occurred. Production activation is still required.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish substantive validated research
        if: needs.gate.outputs.run_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          remote_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$remote_sha" = "$RESEARCH_BASE_SHA"
          patch_sha=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["patch_sha256"])' "$RUNNER_TEMP/proposal/manifest.json")
          python3 -I "$RUNNER_TEMP/cloud_pipeline.py" record --date "$RESEARCH_DATE" --base-sha "$RESEARCH_BASE_SHA" --run-id "$RUN_ID" --patch-sha256 "$patch_sha"
          git add -- ".research/cloud-runs/$RESEARCH_DATE.json"
          git -c core.hooksPath=/dev/null commit -m "Research $RESEARCH_DATE: validated AI-assisted session" -m "Cloud run: https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/main
          published_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$published_sha" = "$(git rev-parse HEAD)"
          printf 'Published %s after isolated validation. The bot push does not trigger separate push CI.\n' "$published_sha" >> "$GITHUB_STEP_SUMMARY"
