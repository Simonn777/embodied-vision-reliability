name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Check calibrated-pose sealing and metrics on artificial data
        run: |
          python -m pip install h5py==3.14.0 poselib==2.0.5
          python -m pytest -q experiments/0013-pose-headroom
          python -m pytest -q experiments/0014-pixel-noise
      - name: Check image-information pipeline on artificial data only
        run: python -m pytest -q experiments/0015-photometric
      - name: Check search diagnostic bindings and scores on artificial data only
        run: python -m pytest -q experiments/0016-search-headroom experiments/0016-review
      - name: Check depth diagnostic on artificial arrays and fake native workers
        run: python -m pytest -q experiments/0017-depth-information experiments/0017-review
      - name: Check native trace supervision and reconstruction on artificial data
        run: python -m pytest -q experiments/0018-depth-trace experiments/0018-review
      - name: Check author-loss control and sealed evaluation on artificial data
        run: python -m pytest -q experiments/0019-author-loss experiments/0019-review
      - name: Check spatial calibration transfer and sealing on artificial data
        run: python -m pytest -q experiments/0020-spatial-depth-transfer experiments/0020-review
      - name: Check depth-field identifiability on manufactured geometry only
        run: python -m pytest -q experiments/0021-identifiability
      - name: Check frontend acquisition using invented bytes and fake responses
        run: PYTHONDONTWRITEBYTECODE=1 python -W error -m unittest discover -s experiments/0022-frontend -p test_acquire.py -v
      - name: Check offline frontend qualification with invented artifacts
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s experiments/0022-frontend -p test_qualify.py -v
      - name: Check prospective multiview method and GT barrier on artificial inputs
        run: |
          python -m pip install scipy==1.13.1
          PYTHONDONTWRITEBYTECODE=1 python -W error -m unittest discover -s experiments/0023-mapfree -p 'test_*.py' -v
      - name: Check virtual-rotation falsifier using artificial geometry and fake inference only
        run: PYTHONDONTWRITEBYTECODE=1 python -W error -m unittest discover -s experiments/0024-virtual-depth -p 'test_*.py' -v
      - name: Check rolling-shutter identifiability with fixed manufactured geometry only
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -W error experiments/0025-rs-identifiability/check_manufactured.py --output-dir scratch/ci-0025-numerical
          PYTHONDONTWRITEBYTECODE=1 python -W error experiments/0025-rs-identifiability/check_exact_four_point.py --output-dir scratch/ci-0025-exact
          PYTHONDONTWRITEBYTECODE=1 python -W error experiments/0025-rs-identifiability/audit_exact.py scratch/ci-0025-exact/mathematics.json
      - name: Check physical RS-depth contracts using artificial arrays and fake transports only
        run: PYTHONDONTWRITEBYTECODE=1 python -W error -m unittest discover -s experiments/0025b-physical-depth -p 'test_*.py' -v
      - name: Check native grid bounds on artificial coordinates without dataset access
        run: |
          python - <<'PY'
          import json, os, sys, unittest
          sys.path.insert(0, 'experiments/0012-score-bounds')
          from grid_backend import build_grid
          receipt = json.loads(build_grid().read_text())
          os.environ['GRID_LIBRARY'] = receipt['library']
          suite = unittest.defaultTestLoader.discover('experiments/0012-score-bounds', pattern='test_grid_backend.py')
          suite.addTests(unittest.defaultTestLoader.discover('experiments/0012-score-bounds', pattern='test_grid_serialization.py'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Check the bounded CLIP preparation helpers without model or network
        run: PYTHONDONTWRITEBYTECODE=1 python -W error -m unittest discover -s experiments/0010 -p 'test_*.py' -v
      - name: Check artificial solver orchestration without Torch or fitting
        working-directory: experiments/0010-solver
        run: PYTHONDONTWRITEBYTECODE=1 python -W error test_admission_fake.py
      - name: Check the cached first-probe guard with artificial files and processes
        working-directory: experiments/0010-guard
        run: PYTHONDONTWRITEBYTECODE=1 python -W error test_guard.py
      - name: Check the prospective headroom pipeline with fake features and models
        working-directory: experiments/0010-headroom
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -W error test_headroom.py
          PYTHONDONTWRITEBYTECODE=1 python -W error test_driver.py
      - name: Exercise the full output pipeline on a smoke partition
        run: python scripts/run_experiment.py --smoke --output scratch/ci-smoke --protocol protocols/0001-synthetic-localization.md
